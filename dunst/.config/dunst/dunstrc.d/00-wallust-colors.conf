[global]
    # The default border color (using your primary accent color)
    frame_color = "#5F92C7"
    # The line that separates multiple notifications
    separator_color = "#BF6875"

[urgency_low]
    background = "#04040A"
    foreground = "#FFB6C4"
    frame_color = "#334D88" # Greenish/accent border for low urgency

[urgency_normal]
    background = "#04040A"
    foreground = "#FFB6C4"
    frame_color = "#5F92C7" # Blueish/accent border for normal urgency

[urgency_critical]
    background = "#203121"  # Red background for critical alerts
    foreground = "#04040A"
    frame_color = "#203121"
